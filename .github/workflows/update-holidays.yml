name: تحديث عطلات سلطنة عمان

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    paths:
      - ".github/workflows/update-holidays.yml"

permissions:
  contents: write

concurrency:
  group: update-oman-holidays
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: جلب تقويم عطلات عمان
        run: |
          curl --fail --silent --show-error --location --retry 3             "https://calendar.google.com/calendar/ical/en.om%23holiday%40group.v.calendar.google.com/public/basic.ics"             --output /tmp/oman-holidays.ics
          node <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("/tmp/oman-holidays.ics", "utf8").replace(/\r?\n[ \t]/g, "");
          const now = new Date();
          const minYear = now.getUTCFullYear() - 1;
          const maxYear = now.getUTCFullYear() + 2;
          const years = {};
          for (let year = minYear; year <= maxYear; year++) years[year] = [];
          for (const block of text.match(/BEGIN:VEVENT[\s\S]*?END:VEVENT/g) || []) {
            const dateMatch = block.match(/DTSTART(?:;VALUE=DATE[^:]*)?:(\d{4})(\d{2})(\d{2})/);
            const nameMatch = block.match(/SUMMARY(?:;[^:]*)?:(.+)/);
            if (!dateMatch || !nameMatch) continue;
            const year = Number(dateMatch[1]);
            if (year < minYear || year > maxYear) continue;
            const date = `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}`;
            const name = nameMatch[1].replace(/\\,/g, ",").replace(/\\n/g, " ").trim();
            if (!years[year].some(item => item.date === date && item.name === name)) {
              years[year].push({ date, name, localName: "" });
            }
          }
          const count = Object.values(years).reduce((sum, list) => sum + list.length, 0);
          if (!count) throw new Error("لم يتم العثور على عطلات في التقويم");
          for (const list of Object.values(years)) list.sort((a, b) => a.date.localeCompare(b.date));
          const output = {
            updatedAt: now.toISOString(),
            source: "Google Calendar - Holidays in Oman",
            country: "OM",
            note: "التواريخ الهجرية تبقى خاضعة للإعلان الرسمي في سلطنة عمان",
            years
          };
          fs.writeFileSync("holidays-om.json", JSON.stringify(output, null, 2) + "\n");
          console.log(`تم حفظ ${count} عطلة`);
          NODE
      - name: حفظ التحديث عند وجود تغيير
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holidays-om.json
          git diff --cached --quiet && exit 0
          git commit -m "تحديث عطلات سلطنة عمان"
          git push
